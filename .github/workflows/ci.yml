name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  html:
    name: HTML válido
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar el HTML principal
        run: npx --yes html-validate@9 "src/index.html"

  build:
    name: Build Angular
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          node-version: 22
          cache: npm

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          args: --no-progress --max-retries 2 --exclude "https://www.linkedin.com" "**/*.html"
          fail: true
          
      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/portfolio-app
